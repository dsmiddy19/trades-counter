name: Update economic calendar

on:
  push:
    paths:
      - ".github/workflows/update-calendar.yml"
  schedule:
    - cron: "15 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch Forex Factory weekly calendar
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            "https://nfs.faireconomy.media/ff_calendar_thisweek.json" \
            -o calendar.new.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("calendar.new.json")
          data = json.loads(path.read_text())
          if not isinstance(data, list) or not data:
              raise SystemExit("Calendar response is empty or invalid")

          required = {"title", "country", "date", "impact"}
          if not any(isinstance(row, dict) and required.issubset(row) for row in data):
              raise SystemExit("Calendar response does not contain expected event fields")
          PY

          mv calendar.new.json calendar.json

      - name: Commit calendar when changed
        shell: bash
        run: |
          if git diff --quiet -- calendar.json; then
            echo "Calendar unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.json
          git commit -m "Update economic calendar"
          git push

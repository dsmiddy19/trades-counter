name: Verify shadow research

on:
  push:
    paths:
      - "index.html"
      - "research/**"
      - ".github/workflows/verify-shadow-research.yml"
  pull_request:
    paths:
      - "index.html"
      - "research/**"
      - ".github/workflows/verify-shadow-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate syntax
        run: |
          node --check research/shadow-v1.js
          node --check research/shadow-v1.test.cjs
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const s=h.match(/<script>\s*([\s\S]*?)<\/script>/);if(!s)throw Error('Main script missing');new Function(s[1]);if(!h.includes('research/shadow-v1.js'))throw Error('Shadow module not linked');"
      - name: Test shadow capture and outcomes
        run: node --test research/shadow-v1.test.cjs
